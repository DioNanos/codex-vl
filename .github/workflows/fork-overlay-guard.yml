---
name: fork-overlay-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: fork CI overlay is intact
    if: github.repository == 'DioNanos/codex-vl'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check the overlay markers
        run: uv run --no-project --with pyyaml==6.0.2 python scripts/fork-overlay/check_fork_ci_overlay.py .
