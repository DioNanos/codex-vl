---
name: fork-overlay-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: fork CI overlay is intact
    if: github.repository == 'DioNanos/codex-vl'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Check the overlay markers
        run: uv run --no-project --with pyyaml==6.0.2 python scripts/fork-overlay/check_fork_ci_overlay.py .
