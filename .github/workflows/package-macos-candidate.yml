name: Package macOS Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/package-macos-candidate.yml"
      - "codex-cli/**"
      - "codex-rs/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version override (defaults to codex-cli/package.json)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-darwin-arm64:
    name: Package macOS arm64 source build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22

      - name: Test launcher diagnostics
        run: node --test codex-cli/tests/*.test.mjs

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          input_version="${{ inputs.release_version }}"
          if [[ -n "${input_version}" ]]; then
            version="${input_version}"
          else
            version="$(node -p "require('./codex-cli/package.json').version")"
          fi
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Stage npm package
        shell: bash
        run: |
          set -euo pipefail
          stage_dir="${RUNNER_TEMP}/staging-codex-darwin-arm64"
          pack_output="${RUNNER_TEMP}/codex-darwin-arm64-${RELEASE_VERSION}.tgz"
          python3 codex-cli/scripts/build_npm_package.py \
            --package codex-darwin-arm64 \
            --release-version "${RELEASE_VERSION}" \
            --staging-dir "${stage_dir}" \
            --pack-output "${pack_output}"
          echo "PACK_OUTPUT=${pack_output}" >> "$GITHUB_ENV"

      - name: Verify source-build package payload
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf "${PACK_OUTPUT}" | sort | tee "${RUNNER_TEMP}/package-files.txt"
          grep -qx "package/codex-rs/Cargo.toml" "${RUNNER_TEMP}/package-files.txt"
          grep -qx "package/scripts/postinstall_darwin_build.js" "${RUNNER_TEMP}/package-files.txt"
          # The source build cannot produce ripgrep, and the daemon refuses a
          # package without codex-path/rg: the pinned manifest must travel with
          # the payload, and the postinstall must both provision rg and check
          # the full layout before it exits.
          grep -qx "package/scripts/rg-manifest" "${RUNNER_TEMP}/package-files.txt"
          tar -xOf "${PACK_OUTPUT}" package/scripts/postinstall_darwin_build.js \
            > "${RUNNER_TEMP}/postinstall_darwin_build.js"
          tar -xOf "${PACK_OUTPUT}" package/scripts/rg-manifest \
            > "${RUNNER_TEMP}/rg-manifest"
          # Never `... | grep -q` here: grep -q exits at the first match, the
          # writer takes SIGPIPE (141), and `set -o pipefail` fails the step on a
          # correct payload. Read the extracted files directly instead.
          rg_digest="$(python3 -c 'import json,sys; body=open(sys.argv[1]).read().split("\n",1)[1]; print(json.loads(body)["platforms"]["macos-aarch64"]["digest"])' "${RUNNER_TEMP}/rg-manifest")"
          if [ -z "${rg_digest}" ]; then
            echo "macOS ripgrep manifest carries no macos-aarch64 digest" >&2
            exit 1
          fi
          for needle in "codex-path/rg" "provisionRipgrep" "verifyPackageLayout" "rg-manifest"; do
            if ! grep -qF -- "${needle}" "${RUNNER_TEMP}/postinstall_darwin_build.js"; then
              echo "macOS postinstall does not reference ${needle}" >&2
              exit 1
            fi
          done
          if tar -xOf "${PACK_OUTPUT}" package/vendor/aarch64-apple-darwin/codex/codex >/dev/null 2>&1; then
            echo "unexpected prebuilt macOS codex binary in package" >&2
            exit 1
          fi

      - name: Upload macOS source-build package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: codex-vl-darwin-arm64-source-${{ env.RELEASE_VERSION }}
          path: ${{ env.PACK_OUTPUT }}
