name: package-linux-arm64

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/package-linux-arm64.yml"
      - ".github/scripts/install-musl-build-tools.sh"
      - "codex-cli/scripts/build_npm_package.py"
      - "codex-cli/bin/codex.js"
      - "codex-cli/bin/codex-exec.js"
      - "codex-rs/**"
      - "third_party/v8/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version override (defaults to codex-cli/package.json)"
        required: false
        type: string

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_PANIC: "abort"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
      INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RELEASE_VERSION" ]; then
            version="$INPUT_RELEASE_VERSION"
          else
            version="$(node -p "require('./codex-cli/package.json').version")"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Linux musl build tools
        env:
          TARGET: aarch64-unknown-linux-musl
        run: |
          set -euo pipefail
          bash .github/scripts/install-musl-build-tools.sh
      - name: Build Linux arm64 native payload
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-unknown-linux-musl
          rustup default 1.95.0
          rustup target add aarch64-unknown-linux-musl
          target="aarch64-unknown-linux-musl"
          # code-mode-runtime depends on v8 with `v8_enable_sandbox`, so the
          # prebuilt has to be the matching profile. Overriding RUSTY_V8_ARCHIVE
          # with the plain build silently wins over the name the v8 build script
          # derives from the enabled features, producing a binary whose
          # IsSandboxEnabled() is false while everything still links and runs.
          profile="ptrcomp_sandbox_release"
          version="$(python3 .github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          binding_dir="${RUNNER_TEMP:-/tmp}/rusty_v8"
          archive_path="${binding_dir}/librusty_v8_${profile}_${target}.a.gz"
          binding_path="${binding_dir}/src_binding_${profile}_${target}.rs"
          checksums_path="${binding_dir}/rusty_v8_${profile}_${target}.sha256"
          checksums_source="third_party/v8/rusty_v8_${version//./_}.sha256"
          mkdir -p "$binding_dir"
          curl -fsSL "${base_url}/librusty_v8_${profile}_${target}.a.gz" -o "$archive_path"
          curl -fsSL "${base_url}/src_binding_${profile}_${target}.rs" -o "$binding_path"
          grep -E "  (librusty_v8_${profile}_${target}[.]a[.]gz|src_binding_${profile}_${target}[.]rs)$" \
            "$checksums_source" > "$checksums_path"
          if [ "$(wc -l < "$checksums_path")" -ne 2 ]; then
            echo "Expected exactly two checksums for ${target} in ${checksums_source}" >&2
            exit 1
          fi
          (cd "$binding_dir" && sha256sum -c "$checksums_path")
          export RUSTY_V8_ARCHIVE="$archive_path"
          export RUSTY_V8_SRC_BINDING_PATH="$binding_path"
          echo "release profile: opt=${CARGO_PROFILE_RELEASE_OPT_LEVEL} lto=${CARGO_PROFILE_RELEASE_LTO} codegen-units=${CARGO_PROFILE_RELEASE_CODEGEN_UNITS} panic=${CARGO_PROFILE_RELEASE_PANIC} strip=${CARGO_PROFILE_RELEASE_STRIP}"
          cargo build --manifest-path codex-rs/Cargo.toml --target aarch64-unknown-linux-musl --release -p codex-bwrap
          bwrap_path="codex-rs/target/aarch64-unknown-linux-musl/release/bwrap"
          if [ ! -f "$bwrap_path" ]; then
            echo "bwrap binary ${bwrap_path} not found" >&2
            exit 1
          fi
          export CODEX_BWRAP_SHA256="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "bwrap sha256=${CODEX_BWRAP_SHA256}"
          cargo build --manifest-path codex-rs/Cargo.toml --target aarch64-unknown-linux-musl --release -p codex-cli -p codex-code-mode-host
          host_path="codex-rs/target/aarch64-unknown-linux-musl/release/codex-code-mode-host"
          if [ ! -f "$host_path" ]; then
            echo "code-mode host ${host_path} not found" >&2
            exit 1
          fi
          before_codex="$(stat -c '%s' codex-rs/target/aarch64-unknown-linux-musl/release/codex)"
          if command -v llvm-strip >/dev/null 2>&1; then
            llvm-strip --strip-all codex-rs/target/aarch64-unknown-linux-musl/release/codex
          elif command -v strip >/dev/null 2>&1; then
            strip --strip-all codex-rs/target/aarch64-unknown-linux-musl/release/codex
          fi
          after_codex="$(stat -c '%s' codex-rs/target/aarch64-unknown-linux-musl/release/codex)"
          printf 'codex size: %s -> %s bytes\n' "$before_codex" "$after_codex"
          ls -lh codex-rs/target/aarch64-unknown-linux-musl/release/codex
          codex-rs/target/aarch64-unknown-linux-musl/release/codex --version
          # Check the archive this build actually linked, not a rebuild of it.
          # RUSTY_V8_ARCHIVE is the input to the link, so reading it answers the
          # question that matters: does the V8 going into these binaries carry
          # the sandbox? The check decodes what `v8__V8__IsSandboxEnabled`
          # returns -- the function the Rust side calls. It replaced a count of
          # `v8::internal::Sandbox` symbol names, which a plain archive passes as
          # soon as it carries one extra object mentioning the name, so the count
          # never separated the two builds. Running the crate's own invariant test
          # here instead would compile a far larger graph in a second profile for
          # no more truth.
          python3 scripts/check_v8_sandbox.py "$RUSTY_V8_ARCHIVE"
      - name: Stage Linux arm64 npm package
        run: |
          set -euo pipefail
          root="$HOME/.local/share/forgejo-artifacts/codex-vl/${GITHUB_SHA}/linux-arm64"
          vendor="$root/vendor/aarch64-unknown-linux-musl"
          out="$root/npm"
          rm -rf "$root"
          mkdir -p "$vendor/codex" "$vendor/codex-resources" "$vendor/path" "$out"
          python3 codex-cli/scripts/prepare_local_vendor.py \
            --vendor-root "$root/vendor" \
            --target aarch64-unknown-linux-musl \
            --codex-binary codex-rs/target/aarch64-unknown-linux-musl/release/codex \
            --include-rg
          # Code mode runs out-of-process since rust-v0.147.0 and fails closed
          # when this binary is missing, so it must travel in the package.
          cp codex-rs/target/aarch64-unknown-linux-musl/release/codex-code-mode-host "$vendor/codex/codex-code-mode-host"
          chmod 755 "$vendor/codex/codex-code-mode-host"
          cp codex-rs/target/aarch64-unknown-linux-musl/release/bwrap "$vendor/codex-resources/bwrap"
          chmod 755 "$vendor/codex-resources/bwrap"
          "$vendor/path/rg" --version | grep -q '^ripgrep '
          python3 codex-cli/scripts/build_npm_package.py \
            --package codex-linux-arm64 \
            --release-version "$RELEASE_VERSION" \
            --vendor-src "$root/vendor" \
            --staging-dir "$root/staging" \
            --pack-output "$out/codex-npm-linux-arm64-$RELEASE_VERSION.tgz"
          find "$root" -maxdepth 5 -type f -print
      - name: Upload Linux arm64 npm package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: codex-vl-linux-arm64-npm-${{ env.RELEASE_VERSION }}
          path: ~/.local/share/forgejo-artifacts/codex-vl/${{ github.sha }}/linux-arm64/npm/*.tgz
          if-no-files-found: error
