name: vl-evidence

# Focused evidence run for the daybreak slash-command tests: upstream 0.167
# moved their assertions into a helper shared by two tests, and under
# cargo test (one process for the whole lib test binary) the helper's
# inline snapshot executes twice at the same call site, which insta
# rejects. The helper is now wrapped in allow_duplicates!. This workflow
# runs only `cargo test --locked -p codex-tui slash_daybreak` three times
# on fresh hosted runners with no cache, asserts a non-zero passed count
# plus both test names green in every run, and prints the per-test names
# in the summary.

on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_MIN_STACK: "8388608"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  slash-daybreak:
    name: slash daybreak (corsa ${{ matrix.corsa }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        corsa: ["1", "2", "3"]
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space on hosted runner
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Install the system libraries the build scripts look for
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - name: "Slash daybreak tests (codex-tui, filtered)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          status=0
          cargo test --locked -p codex-tui slash_daybreak \
            2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee m15-slash-daybreak.out || status=1
          passed="$(grep -E '^test result:' m15-slash-daybreak.out | awk '{s+=$4} END{print s+0}')"
          echo "codex-tui slash_daybreak: ${passed} tests passed"
          [ "$passed" -ge 1 ] || status=1
          grep -F 'slash_daybreak_offers_an_application_when_unavailable ... ok' m15-slash-daybreak.out || status=1
          grep -F 'slash_daybreak_custom_provider_requires_capability ... ok' m15-slash-daybreak.out || status=1
          exit "$status"
      - name: Slash daybreak summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "== per-test results =="
          grep -E '^test .* \.\.\. ' m15-slash-daybreak.out || echo "no test lines captured"
          echo "== test result totals =="
          grep -E '^test result:' m15-slash-daybreak.out || echo "no result lines captured"
