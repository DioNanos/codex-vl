            2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee m5-core-manage-loops.out || status=1
          grep -E 'test result: ok\. 1 passed' m5-core-manage-loops.out || status=1
          grep -F 'dynamic_tools_register_flat_and_namespaced_manage_loops_aliases ... ok' m5-core-manage-loops.out || status=1
          exit "$status"

      - name: "Suite: Vivling runtime and delegation (codex-tui)"
