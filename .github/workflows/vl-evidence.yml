          [ "$rc" -eq 0 ] || status=1; if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then echo "codex-app-server: TIMEOUT after 2880s (bounded evidence above, suite incomplete)"; fi
          passed="$(grep -E '^test result:' m12-codex-app-server.out | awk '{s+=$4} END{print s+0}')"
          failed="$(grep -E '^test result:' m12-codex-app-server.out | awk '{s+=$6} END{print s+0}')"
