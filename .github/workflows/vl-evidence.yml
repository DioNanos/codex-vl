      - name: Suite summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "== every test result line, by suite =="
          for f in m5-*.out; do
            echo "-- $f"
            grep -E '^test result:' "$f" || true
          done
          echo "== suites with failures =="
          grep -lE 'test result: FAILED' m5-*.out || echo "none"

  full-suites:
    name: full suites (corsa ${{ matrix.corsa }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
