          grep -E 'test result: ok\. [1-9][0-9]* passed' m5-vivling.out || status=1
          grep -F 'vivling_layout_config_roundtrip ... ok' m5-vivling.out || status=1
          grep -F 'only_manage_allows_automatic_actions ... ok' m5-vivling.out || status=1
          grep -F 'finish_summary_reports_the_carried_resolution_not_the_thread_owner ... ok' m5-vivling.out || status=1
          exit "$status"

      - name: "Suite: line layout (codex-tui)"
