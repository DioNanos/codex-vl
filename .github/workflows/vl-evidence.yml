name: vl-evidence

# Base evidence for the public 0.166.0-vl.2 release: the full-suites job
# from the merge-candidate evidence workflow, byte-identical in crate list
# and commands, executed on the public release tree so a failure that is
# red by name here too is a base/environment failure, not one introduced
# by the merge candidate.
# The full-suites job runs the COMPLETE, unfiltered test suite
# (cargo test --locked, default features, no test-selection filters)
# of every crate the fork touches in the merge — the same 46-package
# list as the merge-candidate run — three times on fresh runners with
# no cache, per the merge register's literal "full suite of every
# touched crate three consecutive times" requirement. Every crate step
# reports its own non-null passed count in the log; the single crate
# with no test targets (codex-bwrap) records a zero count and is
# evidenced by its green compile instead.
on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_MIN_STACK: "8388608"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  full-suites:
    name: full suites (corsa ${{ matrix.corsa }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        corsa: ["1", "2", "3"]
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space on hosted runner
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Install the system libraries the unfiltered suites use (upstream full-CI set)
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - name: "Full suite: codex-api (unfiltered, default features)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          status=0
          cargo test --locked -p codex-api \
            2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee m12-codex-api.out || status=1
          passed="$(grep -E '^test result:' m12-codex-api.out | awk '{s+=$4} END{print s+0}')"
          echo "codex-api: ${passed} tests passed"
          [ "$passed" -ge 1 ] || status=1
          exit "$status"

      - name: "Full suite: codex-app-server (unfiltered, default features)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
