name: vl-evidence

# Fork regression evidence for a merge candidate branch: executes the
# fork-owned suites (goal extension, goal store, loop/manage_loops, Vivling,
# layout, VL footer, background model client, TUI startup/daemon) and the
# restored auth-retry test, each with a non-zero asserted count, three times
# in a clean hosted environment. Every suite runs even when an earlier suite
# fails: failures are reported by name, nothing is skipped or filtered out
# to make the run green. The excluded-crates job then compiles and tests the
# four packages left out of the workspace check (code-mode host/runtime,
# v8-poc, voice-host) using the same inputs the packaging workflows use:
# the prebuilt V8 archive from the fork release and the Bazel-built native
# voice SDK, both produced on public hosted runners.
# The full-suites job runs the COMPLETE, unfiltered test suite
# (cargo test --locked, default features, no test-selection filters)
# of every crate the fork touches in this merge — the diff between
# the merge commit and upstream rust-v0.167.0 — three times on fresh
# runners with no cache, per the merge register's literal "full suite
# of every touched crate three consecutive times" requirement. Every
# crate step reports its own non-null passed count in the log; the
# single crate with no test targets (codex-bwrap) records a zero
# count and is evidenced by its green compile instead.

on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_MIN_STACK: "8388608"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  fork-suites:
    name: fork suites (corsa ${{ matrix.corsa }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        corsa: ["1", "2", "3"]
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space on hosted runner
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Install the system libraries the build scripts look for
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: "Suite: restored auth-retry test (codex-api, expect 1 passed)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          status=0
          cargo test -p codex-api --lib -- endpoint::models::tests::response_body_limit_survives_auth_retry_without_limiting_other_models_requests -- --exact \
            2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee m5-auth-retry.out || status=1
          grep -E 'test result: ok\. 1 passed' m5-auth-retry.out || status=1
          grep -F 'endpoint::models::tests::response_body_limit_survives_auth_retry_without_limiting_other_models_requests ... ok' m5-auth-retry.out || status=1
          exit "$status"

      - name: "Suite: goal extension (ext/goal, 3 test targets)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          status=0
          cargo test -p codex-goal-extension \
            2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee m5-goal-extension.out || status=1
          ok_targets="$(grep -cE 'test result: ok\. [1-9][0-9]* passed' m5-goal-extension.out || true)"
          [ "$ok_targets" -ge 3 ] || status=1
          grep -F 'installed_goal_tools_create_goal_and_fill_empty_preview ... ok' m5-goal-extension.out || status=1
          grep -F 'installed_goal_tools_only_replace_complete_goal ... ok' m5-goal-extension.out || status=1
          grep -F 'goal_accounting_uses_turn_start_baseline_for_exact_deltas ... ok' m5-goal-extension.out || status=1
          grep -F 'disabled_checklist_preserves_goal_text_that_mentions_the_tool ... ok' m5-goal-extension.out || status=1
          exit "$status"

      - name: "Suite: goal store and loop job persistence (codex-state)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          status=0
          cargo test -p codex-state --lib -- thread_goal thread_loop_job \
            2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee m5-goal-store.out || status=1
          grep -E 'test result: ok\. [1-9][0-9]* passed' m5-goal-store.out || status=1
          grep -F 'replace_update_and_get_thread_goal ... ok' m5-goal-store.out || status=1
          grep -F 'thread_loop_job_crud_roundtrip ... ok' m5-goal-store.out || status=1
          grep -F 'loop_tick_claim_is_atomic_and_reusable_after_finish ... ok' m5-goal-store.out || status=1
          exit "$status"

      - name: "Suite: TUI goal surface (codex-tui)"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          status=0
          cargo test -p codex-tui --lib -- goal \
            2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee m5-tui-goal.out || status=1
          grep -E 'test result: ok\. [1-9][0-9]* passed' m5-tui-goal.out || status=1
          grep -F 'thread_goal_error_message_explains_temporary_session ... ok' m5-tui-goal.out || status=1
          grep -F 'set_thread_goal_draft_materializes_long_objective_and_confirms_before_paste ... ok' m5-tui-goal.out || status=1
          grep -F 'goal_status_indicator_line_formats_goal_text ... ok' m5-tui-goal.out || status=1
          exit "$status"

      - name: "Suite: manage_loops parsing and aliases (codex-tui)"
        if: always()
