  voice-inputs:
    name: voice inputs (bazel native sdk)
    runs-on: ubuntu-24.04
    environment:
      name: bazel
      deployment: false
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./third_party/voice/cargo-ci/produce
        with:
          target: x86_64-unknown-linux-gnu

  excluded-crates:
    name: excluded crates check and test (code-mode, v8-poc, voice-host)
    needs: voice-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUST_MIN_STACK: "8388608"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/codex-rs/target
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space on hosted runner
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Install the system libraries the build scripts look for
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
      - name: Install the ALSA system library required by alsa-sys
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libasound2-dev
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Create CARGO_TARGET_DIR for the voice cargo-ci setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CARGO_TARGET_DIR}"
      - name: Set up native voice dependencies
        uses: ./third_party/voice/cargo-ci/setup
        with:
          target: x86_64-unknown-linux-gnu
      - name: Record inputs and commands
        shell: bash
        run: |
          set -euo pipefail
          echo "commit: $(git rev-parse HEAD)"
          echo "rusty_v8 archive: ${RUSTY_V8_ARCHIVE:-<unset>}"
          sha256sum "${RUSTY_V8_ARCHIVE:?setup-rusty-v8 did not export RUSTY_V8_ARCHIVE}"
          echo "voice runtime: ${CODEX_TEST_VOICE_RUNTIME:-<unset>}"
          echo "pkg_config sdk: ${PKG_CONFIG_PATH_x86_64_unknown_linux-gnu:-<unset>}"
      - name: cargo check --tests of the four excluded packages
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          cargo check --tests \
            -p codex-code-mode-host \
            -p codex-code-mode-runtime \
            -p codex-v8-poc \
            -p codex-voice-host \
            --features codex-v8-poc/sandbox
      - name: cargo test of the four excluded packages
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          export LD_LIBRARY_PATH="${CODEX_TEST_VOICE_RUNTIME:?cargo-ci setup did not export CODEX_TEST_VOICE_RUNTIME}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          status=0
          cargo test \
            -p codex-code-mode-host \
            -p codex-code-mode-runtime \
            -p codex-v8-poc \
            -p codex-voice-host \
            --features codex-v8-poc/sandbox \
            2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee m5-excluded-crates.out || status=1
          ok_targets="$(grep -cE 'test result: ok\. [1-9][0-9]* passed' m5-excluded-crates.out || true)"
          [ "$ok_targets" -ge 4 ] || status=1
          exit "$status"
      - name: Install cargo-nextest (upstream pinned install)
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: packaged voice runtime smoke (ignored tests, needs the prepared runtime)
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          export LD_LIBRARY_PATH="${CODEX_TEST_VOICE_RUNTIME:?cargo-ci setup did not export CODEX_TEST_VOICE_RUNTIME}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          status=0
          NEXTEST_PROFILE=local cargo nextest run --no-fail-fast \
            -p codex-voice-host --test packaged_runtime --run-ignored all --color never \
            2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee m5-packaged-runtime.out || status=1
          grep -E 'PASS \[[^]]*\].*relocated_runtime_initializes_closes_and_rejects_duplicate_initialization' m5-packaged-runtime.out || status=1
          grep -E 'Summary \[[^]]*\] [1-9][0-9]* tests? run: [1-9][0-9]* passed, 0 skipped' m5-packaged-runtime.out || status=1
          exit "$status"
