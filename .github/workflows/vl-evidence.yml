name: vl-evidence

# Fork regression evidence: the full-suites job runs the COMPLETE,
# unfiltered test suite (cargo test --locked --no-fail-fast, default
# features, no test-selection filters) of every crate the fork touches
# -- the crates in the merge diff plus the two test-support packages
# that carry their own tests -- three times on fresh runners with no
# cache, per the merge register's literal "full suite of every touched
# crate three consecutive times" requirement. --no-fail-fast keeps every
# test binary of a crate running after a red one, so later binaries are
# never skipped. The 48 crate steps are split across shards so no job
# can approach the runner wall clock, and every crate command runs under
# its own bounded timeout: a crate that stops returning is recorded as a
# bounded timeout with the partial evidence it produced, and the other
# crates of its shard still run. Every crate step reports its per-crate
# "N passed / M failed" total in the log; the single crate with no test
# targets (codex-bwrap) records a zero count and is evidenced by its
# green compile instead. The same workflow runs unchanged on the public
# base release to separate base/environment failures from merge ones.

on:
  push:
    branches:
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_MIN_STACK: "8388608"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  full-suites:
    name: full suites (corsa ${{ matrix.corsa }} / shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        corsa: ["1", "2", "3"]
        shard: ["core", "s1", "s2", "s3", "s4"]
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space on hosted runner
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Install the system libraries the unfiltered suites use (upstream full-CI set)
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - name: "Full suite: codex-api (unfiltered, default features)"
        if: always() && matrix.shard == 's1'
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          status=0
          timeout -k 30 1380 cargo test --locked --no-fail-fast -p codex-api > m12-codex-api.raw 2>&1
          rc=$?; sed -E 's#/home/[^[:space:])]+#<path>#g' m12-codex-api.raw \
            | tee m12-codex-api.out; rm -f m12-codex-api.raw
          [ "$rc" -eq 0 ] || status=1; if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then echo "codex-api: TIMEOUT after 1380s (bounded evidence above, suite incomplete)"; fi
          passed="$(grep -E '^test result:' m12-codex-api.out | awk '{s+=$4} END{print s+0}')"
          failed="$(grep -E '^test result:' m12-codex-api.out | awk '{s+=$6} END{print s+0}')"
          echo "codex-api: ${passed} passed / ${failed} failed"
          [ "$passed" -ge 1 ] || status=1
          exit "$status"

      - name: "Full suite: codex-app-server (unfiltered, default features)"
