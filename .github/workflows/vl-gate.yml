name: vl-gate

on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git SHA to validate; empty uses the pushed commit
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "8388608"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check README ASCII policy
        working-directory: .
        run: python3 scripts/asciicheck.py README.md
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: rustfmt
      - name: Identity protocol schema round trip
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server-protocol protocol::identity::tests::identity_schema_round_trip_preserves_binding_claims --lib -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-identity-schema.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-identity-schema.out
          grep -F 'protocol::identity::tests::identity_schema_round_trip_preserves_binding_claims ... ok' vl-gate-identity-schema.out
      - name: Check formatting
        run: cargo fmt --all -- --check

  shear:
    name: shear and lock
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: Run cargo shear
        run: cargo shear
      - name: Check Cargo.lock is unchanged
        run: git diff --exit-code Cargo.lock

  deny:
    name: deny and lock
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check
      - name: Check Cargo.lock is unchanged
        run: git diff --exit-code Cargo.lock

  targeted-tests:
    name: targeted tests
    runs-on: ubuntu-24.04
    env:
      RUST_MIN_STACK: "8388608"
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Fleet identity ignores unverified shared daemon
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate unverified_fleet_identity_keeps_shared_daemon_embedded -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-fleet-identity.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-fleet-identity.out
          grep -F 'unverified_fleet_identity_keeps_shared_daemon_embedded ... ok' vl-gate-fleet-identity.out
      - name: Embedded fallback emits user-visible diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate embedded_fallback_emits_user_visible_diagnostic -- --exact --nocapture 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-fallback-diagnostic.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-fallback-diagnostic.out
          grep -F 'embedded_fallback_emits_user_visible_diagnostic ... ok' vl-gate-fallback-diagnostic.out
      - name: Fleet identity rejects explicit shared endpoint
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate unverified_fleet_identity_rejects_explicit_shared_endpoint -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-fleet-explicit.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-fleet-explicit.out
          grep -F 'unverified_fleet_identity_rejects_explicit_shared_endpoint ... ok' vl-gate-fleet-explicit.out
      - name: Fleet identity rejects explicit WebSocket endpoint
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate unverified_fleet_identity_rejects_explicit_websocket_with_workload_identity -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-fleet-websocket.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-fleet-websocket.out
          grep -F 'unverified_fleet_identity_rejects_explicit_websocket_with_workload_identity ... ok' vl-gate-fleet-websocket.out
      - name: No Fleet identity attaches as today
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate tui_without_fleet_identity_attaches_to_live_shared_daemon -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-no-fleet.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-no-fleet.out
          grep -F 'tui_without_fleet_identity_attaches_to_live_shared_daemon ... ok' vl-gate-no-fleet.out
      - name: Missing socket stays embedded
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate absent_socket_keeps_fleet_tui_embedded -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-absent-socket.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-absent-socket.out
          grep -F 'absent_socket_keeps_fleet_tui_embedded ... ok' vl-gate-absent-socket.out
      - name: C5 thread binding rejects cross-owner access
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal thread_binding_rejects_cross_owner_resume_and_preserves_owner_on_fork -- --exact --nocapture 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c5-thread-binding.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c5-thread-binding.out
          grep -F 'test thread_binding_rejects_cross_owner_resume_and_preserves_owner_on_fork ... ok' vl-gate-c5-thread-binding.out
      - name: C5 thread binding rejects unbound access
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal thread_binding_rejects_unbound_resume_and_fork -- --exact --nocapture 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c5-unbound-thread-binding.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c5-unbound-thread-binding.out
          grep -F 'test thread_binding_rejects_unbound_resume_and_fork ... ok' vl-gate-c5-unbound-thread-binding.out
      - name: C5 persisted thread binding rejects unbound access
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal thread_binding_persistence_rejects_other_owner_and_unbound_after_restart -- --exact --nocapture 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c5-persisted-thread-binding.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c5-persisted-thread-binding.out
          grep -F 'test thread_binding_persistence_rejects_other_owner_and_unbound_after_restart ... ok' vl-gate-c5-persisted-thread-binding.out
      - name: C6 new TUI identity is never reused
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal new_tui_b_never_reuses_a_identity -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c6-new-tui.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c6-new-tui.out
          grep -F 'test new_tui_b_never_reuses_a_identity ... ok' vl-gate-c6-new-tui.out
      - name: C6 resume fork and reauthorize incarnation
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal resume_fork_and_new_incarnation_reauthorize -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c6-resume-fork.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c6-resume-fork.out
          grep -F 'test resume_fork_and_new_incarnation_reauthorize ... ok' vl-gate-c6-resume-fork.out
      - name: C6 cwd is not identity
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal cwd_does_not_become_identity -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c6-cwd.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c6-cwd.out
          grep -F 'test cwd_does_not_become_identity ... ok' vl-gate-c6-cwd.out
      - name: C6 stale socket restart is scoped
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal stale_socket_and_restart_are_scoped -- --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c6-stale-socket.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c6-stale-socket.out
          grep -F 'test stale_socket_and_restart_are_scoped ... ok' vl-gate-c6-stale-socket.out
      - name: C8 verified metadata reaches bound MCP child
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal auditor_first_mcp_spawn_on_bound_connection_scrubs_reserved_env -- --exact --nocapture 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c8-bound-metadata.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c8-bound-metadata.out
          grep -F 'test auditor_first_mcp_spawn_on_bound_connection_scrubs_reserved_env ... ok' vl-gate-c8-bound-metadata.out
      - name: C8 unbound MCP child never carries verified metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal unbound_mcp_spawn_never_carries_verified_metadata -- --exact --ignored --nocapture 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c8-unbound-metadata.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c8-unbound-metadata.out
          grep -F 'test unbound_mcp_spawn_never_carries_verified_metadata ... ok' vl-gate-c8-unbound-metadata.out
      - name: C8 unbound MCP child rejects reserved verified override
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --features d174-test-fixture --test d174_c6_terminal unbound_mcp_spawn_rejects_reserved_verified_env_var_override -- --exact --ignored --nocapture 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-c8-unbound-override.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-c8-unbound-override.out
          grep -F 'test unbound_mcp_spawn_rejects_reserved_verified_env_var_override ... ok' vl-gate-c8-unbound-override.out
      - name: Test model message caps
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-core -- persistent_instructions_reject_oversized_values persistent_instructions_preserve_empty_none_and_exact_limit persistent_instructions_validate_after_placeholder_rendering guardian_node_repl_policy_rejects_oversized_values guardian_node_repl_policy_accepts_none_empty_and_exact_limit local_catalog_loader_accepts_exact_limit_and_rejects_oversized_messages guardian_oversized_node_repl_policy_fails_closed_without_model_or_tool_requests 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-model-message-caps.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-model-message-caps.out
          grep -F 'persistent_instructions_reject_oversized_values ... ok' vl-gate-model-message-caps.out
          grep -F 'persistent_instructions_preserve_empty_none_and_exact_limit ... ok' vl-gate-model-message-caps.out
          grep -F 'persistent_instructions_validate_after_placeholder_rendering ... ok' vl-gate-model-message-caps.out
          grep -F 'guardian_node_repl_policy_rejects_oversized_values ... ok' vl-gate-model-message-caps.out
          grep -F 'guardian_node_repl_policy_accepts_none_empty_and_exact_limit ... ok' vl-gate-model-message-caps.out
          grep -F 'local_catalog_loader_accepts_exact_limit_and_rejects_oversized_messages ... ok' vl-gate-model-message-caps.out
          grep -F 'guardian_oversized_node_repl_policy_fails_closed_without_model_or_tool_requests ... ok' vl-gate-model-message-caps.out
      - name: Test terminal guardian cap proof
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p codex-rmcp-client --bin test_stdio_server
          cargo test -p codex-core --test all -- suite::guardian_review::guardian_oversized_node_repl_policy_denies_before_tool_execution --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-model-guardian-terminal.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-model-guardian-terminal.out
          grep -F 'test suite::guardian_review::guardian_oversized_node_repl_policy_denies_before_tool_execution ... ok' vl-gate-model-guardian-terminal.out
      - name: Test terminal guardian execution probe
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-core --test all -- suite::guardian_review::guardian_approved_node_repl_policy_records_server_call --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-model-guardian-execution-probe.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-model-guardian-execution-probe.out
          grep -F 'test suite::guardian_review::guardian_approved_node_repl_policy_records_server_call ... ok' vl-gate-model-guardian-execution-probe.out
      - name: Test terminal persistent cap proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-core --test all -- suite::guardian_review::persistent_oversized_instructions_fail_session_before_inference --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-model-persistent-terminal.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-model-persistent-terminal.out
          grep -F 'test suite::guardian_review::persistent_oversized_instructions_fail_session_before_inference ... ok' vl-gate-model-persistent-terminal.out
      - name: Test terminal rendered persistent cap proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-core --test all -- suite::guardian_review::persistent_rendered_oversized_instructions_fail_session_before_inference --exact 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-model-rendered-persistent-terminal.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-model-rendered-persistent-terminal.out
          grep -F 'test suite::guardian_review::persistent_rendered_oversized_instructions_fail_session_before_inference ... ok' vl-gate-model-rendered-persistent-terminal.out
      - name: Test model catalog ingress caps
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-api -- remote_models_loader_accepts_exact_limit_and_rejects_oversized_messages 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-model-api-caps.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-model-api-caps.out
          grep -F 'remote_models_loader_accepts_exact_limit_and_rejects_oversized_messages ... ok' vl-gate-model-api-caps.out
          cargo test -p codex-models-manager -- file_cache_loader_accepts_exact_limit_and_rejects_oversized_messages 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-model-cache-caps.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-model-cache-caps.out
          grep -F 'file_cache_loader_accepts_exact_limit_and_rejects_oversized_messages ... ok' vl-gate-model-cache-caps.out
      - name: Test protocol model message caps
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-protocol -- model_message_text_cap_reports_field_slug_size_and_no_content model_message_text_cap_counts_utf8_bytes_without_truncating 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-model-protocol-caps.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-model-protocol-caps.out
          grep -F 'model_message_text_cap_reports_field_slug_size_and_no_content ... ok' vl-gate-model-protocol-caps.out
          grep -F 'model_message_text_cap_counts_utf8_bytes_without_truncating ... ok' vl-gate-model-protocol-caps.out
      - name: Identity startup refuses a broken channel before binding
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --test identity_startup_process 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-identity-startup.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-identity-startup.out
          grep -F 'required_without_declaration_refuses_before_binding ... ok' vl-gate-identity-startup.out
          grep -F 'required_with_closed_declaration_refuses_before_binding ... ok' vl-gate-identity-startup.out
          grep -F 'standalone_starts_and_listens_without_declaration ... ok' vl-gate-identity-startup.out
      - name: Identity channel validation rejects broken declarations
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --lib -- identity_channel:: 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-identity-channel.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-identity-channel.out
          grep -F 'identity_channel::decision_tests::absent_declaration_is_broken ... ok' vl-gate-identity-channel.out
          grep -F 'identity_channel::tests::excessive_response_is_rejected_and_closed ... ok' vl-gate-identity-channel.out
      - name: Identity verifier channel surfaces authority failures
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --lib -- authority::channel_tests 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-identity-authority.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-identity-authority.out
          grep -F 'authority::channel_tests::authority_eof_is_rejected ... ok' vl-gate-identity-authority.out
      # Negative identity paths exercised in the gate (unreachable, forged,
      # challenge mismatch, replay, expiry; verifier descriptor policy; client
      # channel and startup paths).
      - name: Identity verify path rejects unreachable, tampered, mismatched, replayed, expired
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-app-server --lib -- identity::tests:: 2>&1 | sed -E 's#/home/[^[:space:])]+#<path>#g' | tee vl-gate-identity-verify.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-identity-verify.out
          grep -F 'identity::tests::authority_unreachable_fails_closed ... ok' vl-gate-identity-verify.out
          grep -F 'identity::tests::tampered_outer_claims_are_rejected_not_normalized ... ok' vl-gate-identity-verify.out
