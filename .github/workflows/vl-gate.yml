name: vl-gate

on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git SHA to validate; empty uses the pushed commit
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "8388608"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  shear:
    name: shear and lock
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: Run cargo shear
        run: cargo shear
      - name: Check Cargo.lock is unchanged
        run: git diff --exit-code Cargo.lock

  deny:
    name: deny and lock
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check
      - name: Check Cargo.lock is unchanged
        run: git diff --exit-code Cargo.lock

  targeted-tests:
    name: targeted tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - name: Fleet identity ignores unverified shared daemon
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate attach_identity_gate::unverified_fleet_identity_keeps_shared_daemon_embedded -- --exact 2>&1 | tee vl-gate-fleet-identity.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-fleet-identity.out
          grep -F 'attach_identity_gate::unverified_fleet_identity_keeps_shared_daemon_embedded ... ok' vl-gate-fleet-identity.out
      - name: Fleet identity rejects explicit shared endpoint
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate attach_identity_gate::unverified_fleet_identity_rejects_explicit_shared_endpoint -- --exact 2>&1 | tee vl-gate-fleet-explicit.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-fleet-explicit.out
          grep -F 'attach_identity_gate::unverified_fleet_identity_rejects_explicit_shared_endpoint ... ok' vl-gate-fleet-explicit.out
      - name: No Fleet identity attaches as today
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate attach_identity_gate::tui_without_fleet_identity_attaches_to_live_shared_daemon -- --exact 2>&1 | tee vl-gate-no-fleet.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-no-fleet.out
          grep -F 'attach_identity_gate::tui_without_fleet_identity_attaches_to_live_shared_daemon ... ok' vl-gate-no-fleet.out
      - name: Missing socket stays embedded
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p codex-tui --features identity-gate-test --test attach_identity_gate attach_identity_gate::absent_socket_keeps_fleet_tui_embedded -- --exact 2>&1 | tee vl-gate-absent-socket.out
          grep -E 'test result: ok\. [1-9][0-9]* passed' vl-gate-absent-socket.out
          grep -F 'attach_identity_gate::absent_socket_keeps_fleet_tui_embedded ... ok' vl-gate-absent-socket.out
