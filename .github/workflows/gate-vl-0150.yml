name: gate-vl-0150

# Gate pre-audit per il merge vl 0.150.1: workspace test compile (base
# instructions fixtures), REGISTER suites (core/app-server/tui) e
# differenziale KNOWN-FAIL contro il develop pre-merge — stessa suite, stessi
# runner, confronto per INSIEMI di fail (un rosso già presente su develop non
# è del candidato).

on:
  push:
    branches:
      - gate-vl-0150

jobs:
  gate:
    name: gate (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUST_MIN_STACK: 8388608
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: candidate
            ref: 22c30373bff4a7645ce0bf50102f49770b8a8e29
          - label: develop-baseline
            ref: 16c71464de60318b41b4d62f6d9abec84ae00bd6
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-nextest
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Install libcap-dev (bwrap build.rs needs pkg-config libcap on gnu)
        run: sudo apt-get update && sudo apt-get install -y libcap-dev
      - name: Workspace-adjacent test compile for touched crates (base_instructions fixtures)
        # Full-workspace no-run hit `ld: Bus error` (OOM/disk) on hosted runners
        # even with debug=0 — measured, not assumed. The 11 base_instructions
        # fixtures live in codex-core/app-server: -p compiles them all.
        run: cargo test --no-run -p codex-core -p codex-app-server -p codex-tui
      - name: REGISTER suites (core + app-server + tui)
        run: |
          mkdir -p /tmp/gate
          set -o pipefail
          cargo nextest run -p codex-core -p codex-app-server -p codex-tui 2>&1 | tee /tmp/gate/nextest-output.txt
          exit "${PIPESTATUS[0]}"
      - name: Upload nextest output
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # in-tree pin
        with:
          name: nextest-${{ matrix.label }}
          path: /tmp/gate/nextest-output.txt
          if-no-files-found: warn
